name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.1" # .fvmrc と同期させること
          channel: stable
          cache: true
      - name: Resolve workspace
        run: dart pub get
      - name: Analyze
        run: flutter analyze packages examples
      - name: Test endevir
        run: flutter test
        working-directory: packages/endevir
      - name: Test endevir_reporter
        run: dart test
        working-directory: packages/endevir_reporter
      - name: Test endevir_cli
        run: dart test
        working-directory: packages/endevir_cli
      - name: Test example app (widget tests)
        run: flutter test
        working-directory: examples/flutter_app

  docs-and-codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          package-manager-cache: false
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Markdown lint
        run: pnpm lint:md
      - name: Format check
        run: pnpm format:check
      - name: Public docs boundary check
        run: pnpm check:docs
      - name: Codegen up-to-date check
        run: |
          pnpm codegen
          git diff --exit-code -- packages/endevir_reporter/lib/src/generated schema/generated
